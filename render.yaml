# Independent static website; no compute plan, database or disk.
previews:
  generation: "off"
services:
  - type: web
    runtime: static
    name: tbi-investments-website
    domains:
      - "tbi-investments.ch"
    autoDeployTrigger: "off"
    buildCommand: "test -s public/index.html && test -s public/en/index.html"
    staticPublishPath: "./public"
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: "/*"
        name: "Content-Security-Policy"
        value: "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; worker-src 'none'"
      - path: "/*"
        name: "X-Content-Type-Options"
        value: "nosniff"
      - path: "/*"
        name: "X-Frame-Options"
        value: "DENY"
      - path: "/*"
        name: "Referrer-Policy"
        value: "no-referrer"
      - path: "/*"
        name: "Permissions-Policy"
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), xr-spatial-tracking=()"
      - path: "/*"
        name: "Cross-Origin-Opener-Policy"
        value: "same-origin"
      - path: "/*"
        name: "Cross-Origin-Resource-Policy"
        value: "same-origin"
      - path: "/*"
        name: "Cache-Control"
        value: "no-store"
      - path: "/*"
        name: "X-Robots-Tag"
        value: "noindex, nofollow"
